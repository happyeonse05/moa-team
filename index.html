function bookmark(p){const saved=state.saved.includes(p.id);return `<button class="iconbtn ${saved?'saved':''}" data-action="bookmark" data-id="${p.id}" aria-label="${esc(p.name)} 스크랩 ${saved?'해제':'저장'}" aria-pressed="${saved}">${I('bookmark')}</button>`}
function policyCard(p,why=''){return `<article class="card policy"><div class="row start"><div><div class="meta">${badge(p.cat)}${status(p)}</div><h3>${esc(p.name)}</h3><p>${esc(why||p.desc)}</p></div>${bookmark(p)}</div>${progress(p)}<div class="row"><small>${S(p).applied?'사용자가 완료로 표시함':`서류 ${S(p).checked.length}/${p.docs.length} 준비`}</small>${btn(S(p).applied?'신청 상태 보기':'체크리스트 보기','detail',p.id,'soft','right')}</div></article>`}
const navigation=[['home','홈','home'],['vault','보관함','folder'],['calendar','캘린더','calendar'],['community','커뮤니티','community']];
function render(){const nav=navigation.map(([id,t,i])=>`<button data-nav="${id}" class="${(view===id||view==='detail'&&previous===id)?'active':''}" ${view===id?'aria-current="page"':''}>${I(i)}<span>${t}</span></button>`).join('');$('side-nav').innerHTML=nav;$('bottom-nav').innerHTML=nav;$('top').innerHTML=`${view==='detail'?`<button class="back" data-action="back">${I('back')} 이전 화면</button>`:`<span class="brand">${brand}</span><span class="desktop-title muted">청년정책 신청 도우미</span>`}<span class="demo">시연용</span>`;$('page').innerHTML=({home:home,vault:vault,detail:detail,calendar:calendar,community:community}[view])()}
function go(v){closeModal();view=v;query='';render();window.scrollTo(0,0)}
function openDetail(id){if(!P(id))return;if(view!=='detail')previous=view;pid=id;go('detail')}
function home(){const current=policies.find(p=>state.saved.includes(p.id)&&!S(p).applied)||policies[0],applied=policies.filter(p=>S(p).applied),similar=policies.filter(p=>!S(p).applied&&applied.some(q=>q.docs.filter(d=>p.docs.includes(d)).length>=2));return `<div class="hero"><div><div class="eyebrow">온빛과 함께하는 정책 신청</div><h1>나에게 필요한 정책,<br>한 걸음씩 모아.</h1><p>자격 확인부터 서류 준비, 신청까지.<br>온빛의 소켓을 하나씩 채워 보세요.</p>${btn('준비 중인 정책 보기','detail',current.id,'primary','right')}</div>${mascot(stage(current))}</div>${section('신청 준비 중',policies.filter(p=>state.saved.includes(p.id)&&!S(p).applied).map(p=>policyCard(p)).join('')||empty('스크랩한 준비 중인 정책이 없어요.'),'예시 정책')}${section('지원한 정책과 비슷한 정책',similar.length?`<p class="muted" style="margin-bottom:10px">신청 완료한 정책과 예시 필요 서류가 2개 이상 겹치는 정책이에요.</p>${similar.map(p=>policyCard(p,'준비했던 서류와 일부 겹치는 예시 정책')).join('')}`:empty('비슷한 예시 정책이 없어요.'))}${section('정책 모아보기',policies.map(p=>policyCard(p)).join(''))}`}
function detail(){const p=P(pid),s=S(p),n=stage(p),left=p.docs.length-s.checked.length,mood=s.applied?'happy':s.failed?'failed':delta(p.deadline)<=7?'urgent':'normal';return `<div class="card"><div class="row"><div class="meta">${badge(p.cat)}${status(p)}</div>${bookmark(p)}</div><div class="detail-title">${mascot(n,mood)}<div><h1>${esc(p.name)}</h1><p>${esc(p.desc)}</p><p>예시 마감 · ${dateText(p.deadline)}</p></div></div>${progress(p)}</div>${section('1. 자격 확인',`<div class="card"><p class="muted">공식 공고에서 조건을 확인했다고 직접 표시하는 시연 항목이에요.</p><div class="criteria">${p.criteria.map((c,i)=>`<label><input type="checkbox" data-criterion="${i}" ${s.criteria[i]?'checked':''} ${s.applied?'disabled':''}>${esc(c)}</label>`).join('')}</div>${btn(s.failed?'자격 미충족 표시 해제':'자격 미충족 표시','failed','','','',s.applied)}</div>`,`${s.criteria.filter(Boolean).length}/${p.criteria.length} 확인`)}${section('2. 증빙서류 체크리스트',`<div class="note ${s.applied?'green':s.failed?'red':''}" style="margin-bottom:11px">${mascot(n,mood)}<span>${s.applied?'신청 완료로 표시했어요.':s.failed?'자격 조건을 다시 확인해 보세요.':left?`${left}개만 더 챙기면 서류 준비 소켓이 채워져요.`:'필요 서류를 모두 준비했어요!'}</span></div><div class="card checklist">${p.docs.map(id=>{const d=docs[id],done=s.checked.includes(id);return `<div class="checkrow"><button class="check ${done?'checked':''}" aria-label="${esc(d.name)} 준비 ${done?'해제':'완료'}" aria-pressed="${done}" data-action="check" data-id="${id}" ${s.applied?'disabled':''}>${done?I('check'):''}</button><div><h3 class="${done?'done':''}">${esc(d.name)}</h3><p>${done?'준비 완료로 표시했어요.':esc(d.provider+' · '+d.desc)}</p><div class="actions">${V(id)?btn(done?'보관함 확인':'보관함 연결','connect',id,'','folder',s.applied):''}${d.url?`<a class="btn" href="${d.url}" target="_blank" rel="noopener noreferrer">${I('external')} 발급처 열기</a>`:btn('어떻게 준비해요?','guide',id)}${btn('올리기','upload',id,'','upload',s.applied)}</div></div></div>`}).join('')}</div>`,`${s.checked.length}/${p.docs.length} 준비`)}${section('3. 신청',`<div class="card"><p class="muted" style="margin-bottom:12px">실제 신청은 공식 기관에서 진행해요. 여기서는 상태만 표시합니다.</p><div class="actions">${btn(s.applied?'신청 완료 표시 취소':'신청 완료로 표시','apply','','primary','check',!s.applied&&n<2)}${btn(state.calendar.includes(pid)?'마감일 제거':'마감일 추가','calendar-toggle',pid,'','calendar')}${btn('캘린더 파일','ics',pid,'','download')}</div></div>`)}`}
function vault(){const q=query.trim().toLowerCase(),ds=state.vault.filter(d=>docs[d.id].name.toLowerCase().includes(q)),ps=policies.filter(p=>state.saved.includes(p.id)&&p.name.toLowerCase().includes(q)),soon=state.vault.find(d=>d.review&&delta(d.review)>=0&&delta(d.review)<=7);return `<div class="pagehead"><h1>내 보관함</h1><p>준비한 서류와 관심 정책을 한곳에 모아요.</p></div><input class="search" id="search" type="search" placeholder="서류 또는 정책 검색" aria-label="서류 또는 정책 검색" value="${esc(query)}"><div class="tabs">${[['all','전체'],['docs',`내 서류 ${state.vault.length}`],['saved',`스크랩 ${state.saved.length}`]].map(([id,t])=>`<button class="tab ${tab===id?'active':''}" data-action="tab" data-id="${id}" aria-pressed="${tab===id}">${t}</button>`).join('')}</div>${soon&&tab!=='saved'?`<div class="note red">${mascot(0,'urgent')}<span>${esc(docs[soon.id].name)}의 ${soon.sample?'예시 ':''}재확인 날짜가 ${delta(soon.review)}일 남았어요.</span></div>`:''}${tab!=='saved'?section('내 서류',`<div class="grid">${ds.map(d=>`<article class="card doc"><span class="fileicon">${I('file')}</span><h3>${esc(docs[d.id].name)}</h3><small>사용처 ${policies.filter(p=>S(p).checked.includes(d.id)).length}곳 · ${d.sample?'예시':'로컬 파일'}</small>${d.review?badge(delta(d.review)<0?'재확인 필요':`재확인 ${dd(d.review)}`,delta(d.review)<=7?'red':'green'):badge('재확인 날짜 미설정')}<div class="actions"><button data-action="view-doc" data-id="${d.id}">정보 보기</button><button class="danger" data-action="remove" data-id="${d.id}">삭제</button></div></article>`).join('')}<button class="add" data-action="upload">${I('plus')}서류 추가</button></div>`):''}${tab!=='docs'?section('스크랩한 정책',ps.map(p=>policyCard(p)).join('')||empty('저장된 정책이 없어요.')):''}`}
function calendar(){const y=month.getFullYear(),m=month.getMonth(),start=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),events=policies.filter(p=>state.calendar.includes(p.id)).sort((a,b)=>a.deadline.localeCompare(b.deadline));let cells='<span></span>'.repeat(start);for(let d=1;d<=count;d++){const dt=dateISO(new Date(y,m,d)),p=events.find(p=>p.deadline===dt),cl=dt===dateISO(today)?'today':'';cells+=p?`<button class="marked ${cl}" data-action="detail" data-id="${p.id}" aria-label="${esc(p.name)} 마감 ${d}일">${d}</button>`:`<span class="${cl}">${d}</span>`}return `<div class="pagehead"><h1>캘린더</h1><p>정책 신청 마감일을 모아두세요.</p></div><div class="card"><div class="row"><button class="iconbtn" data-action="prev-month" aria-label="이전 달">${I('left')}</button><h2>${y}년 ${m+1}월</h2><button class="iconbtn" data-action="next-month" aria-label="다음 달">${I('right')}</button></div><div class="cal">${['일','월','화','수','목','금','토'].map(d=>`<span class="weekday">${d}</span>`).join('')}${cells}</div></div>${section('등록한 마감일',events.map(p=>`<article class="card row"><div class="eventdate"><small>${Number(p.deadline.slice(5,7))}월</small><strong>${Number(p.deadline.slice(8,10))}</strong></div><div style="flex:1;min-width:0"><h3>${esc(p.name)}</h3><small>예시 마감 ${dd(p.deadline)}</small><div class="actions" style="margin-top:7px">${btn('정책 보기','detail',p.id)}${btn('제거','calendar-toggle',p.id)}</div></div><button class="iconbtn" data-action="ics" data-id="${p.id}" aria-label="캘린더 파일 내보내기">${I('download')}</button></article>`).join('')||empty('정책 화면에서 마감일을 추가하세요.'))}<div class="actions" style="margin-top:12px">${btn('전체 캘린더 파일 내보내기','ics-all','','soft','download',!events.length)}</div><p class="footer">.ics 파일을 캘린더 앱으로 가져올 수 있어요. 실제 계정 자동 동기화는 아직 연결되지 않았어요.</p>`}
function community(){return `<div class="pagehead"><div class="row"><h1>커뮤니티</h1>${btn('글쓰기','new-post','','primary','plus')}</div><p>정책 신청 경험을 함께 나누어요.</p></div><div class="note">${mascot(1)}<div><strong>실명제 커뮤니티</strong><p style="font-size:12px;margin-top:4px">실명 인증 연결 전으로 예시 이름만 사용해요. 실제 이름은 받지 않아요.</p></div></div>${section('정책별 이야기',`<div class="tabs">${[['all','전체'],...policies.map(p=>[p.id,p.name])].map(([id,t])=>`<button class="tab ${filter===id?'active':''}" data-action="filter" data-id="${id}">${esc(t)}</button>`).join('')}</div>${state.posts.filter(p=>filter==='all'||p.policy===filter).map(p=>`<article class="card post"><div class="who"><span class="avatar">${esc(p.name[0])}</span><div style="flex:1"><h3>${esc(p.name)}</h3><small>시연용 게시글</small></div>${badge('예시')}</div>${badge(P(p.policy).name)}<h3>${esc(p.title)}</h3><p>${esc(p.body)}</p>${p.mine?`<div style="margin-top:10px">${btn('글 삭제','delete-post',p.id,'danger')}</div>`:''}</article>`).join('')||empty('아직 등록된 이야기가 없어요.')}`)}`}
function modal(title,body){$('dialog').innerHTML=`<div class="row"><h2 id="dialog-title">${esc(title)}</h2><button class="iconbtn" data-action="close" aria-label="닫기">${I('close')}</button></div>${body}`;$('modal').classList.add('open');document.body.style.overflow='hidden';$('dialog').querySelector('button').focus()}
function closeModal(){$('modal').classList.remove('open');document.body.style.overflow=''}
function confirmAction(title,message,action,id=''){modal(title,`<p>${esc(message)}</p><div class="actions">${btn('취소','close')}${btn('확인',action,id,'primary')}</div>`)}
function upload(id){modal('서류 등록',`<p>시연용 PDF 또는 이미지만 등록하세요. 실제 개인정보가 담긴 서류는 올리지 마세요. 이 브라우저에만 저장됩니다.</p><form id="uploadform"><label>서류 종류<select name="doc">${Object.entries(docs).map(([k,d])=>`<option value="${k}" ${id===k?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><label>시연용 파일<input name="file" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" required></label><label>재확인 날짜 (선택)<input name="review" type="date"></label><p>최대 10MB · 직접 입력한 날짜이며 법적 유효기간을 판정하지 않아요.</p><div class="error" id="error" role="alert"></div><div class="actions"><button type="button" class="btn" data-action="close">취소</button><button type="submit" class="btn primary">보관함에 저장</button></div></form>`)}
function postForm(){modal('정책 이야기 작성',`<p>실명 인증 전 시연용 이름만 사용하며 글은 이 브라우저에만 저장됩니다.</p><form id="postform"><label>작성자<input value="시연 사용자 (예시)" disabled></label><label>정책<select name="policy">${policies.map(p=>`<option value="${p.id}" ${filter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>제목<input name="title" maxlength="60" required></label><label>내용<textarea name="body" maxlength="1000" required></textarea></label><div class="error" id="error" role="alert"></div><div class="actions"><button type="button" class="btn" data-action="close">취소</button><button class="btn primary" type="submit">등록</button></div></form>`)}
function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open('moa_independent_team_files_v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function fileOp(mode,fn){const d=await db();return new Promise((resolve,reject)=>{const tx=d.transaction('files',mode),r=fn(tx.objectStore('files'));let result;r.onsuccess=()=>{result=r.result};tx.oncomplete=()=>{d.close();resolve(result)};tx.onerror=tx.onabort=()=>{d.close();reject(tx.error||Error('storage'))}})}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function exportICS(ids){const list=policies.filter(p=>ids.includes(p.id));if(!list.length)return;const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MOA TEAM DEMO//KO','CALSCALE:GREGORIAN',...list.flatMap(p=>['BEGIN:VEVENT',`UID:moa-demo-${p.id}-${p.deadline}@moa.local`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${p.deadline.replaceAll('-','')}`,`SUMMARY:[시연용] ${p.name} 마감`,'DESCRIPTION:실제 신청 기한이 아닌 시연 예시입니다.','END:VEVENT']),'END:VCALENDAR',''];const enc=new TextEncoder();function fold(l){let out='',part='',bytes=0;for(const c of l){const n=enc.encode(c).length;if(bytes+n>75){out+=part+'\r\n';part=' ';bytes=1}part+=c;bytes+=n}return out+part}download(new Blob([lines.map(fold).join('\r\n')],{type:'text/calendar;charset=utf-8'}),'moa-demo-deadlines.ics');notify('시연용 캘린더 파일을 내보냈어요.')}
async function action(a,id){const p=P(pid),s=S(p);switch(a){case 'detail':return openDetail(id);case 'back':return go(previous);case 'bookmark':state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];notify(state.saved.includes(id)?'관심 정책에 저장했어요.':'스크랩을 해제했어요.');break;case 'check':if(s.applied||!p.docs.includes(id))return;s.checked=s.checked.includes(id)?s.checked.filter(x=>x!==id):[...s.checked,id];break;case 'failed':if(!s.applied)s.failed=!s.failed;break;case 'connect':if(!V(id)||s.applied||!p.docs.includes(id))return;if(s.checked.includes(id))return action('view-doc',id);s.checked.push(id);notify('보관함의 서류를 연결했어요.');break;case 'guide':return modal(docs[id].name,`<p>${esc(docs[id].provider+' · '+docs[id].desc)}. 실제 제출 기준은 공식 공고를 확인하세요.</p><div class="actions">${btn('확인','close')}</div>`);case 'upload':return upload(id);case 'view-doc':{const d=V(id);if(!d)return;return modal(docs[id].name,`<p>${d.sample?'시연용으로 미리 등록한 항목입니다. 실제 파일은 포함되어 있지 않아요.':`등록 파일: ${esc(d.filename)}`}</p>${d.review?`<p>재확인 날짜: ${esc(d.review)}</p>`:''}<div class="actions">${d.sample?'':btn('파일 내려받기','download-doc',id,'','download')}${btn('닫기','close')}</div>`)}case 'download-doc':try{const f=await fileOp('readonly',o=>o.get(id));if(!f)throw Error();download(f.blob,f.name)}catch{notify('저장된 파일이 없어요.')}return;case 'remove':return confirmAction('서류 삭제','보관함과 아직 신청하지 않은 정책의 해당 준비 표시에서 삭제해요. 완료한 신청 기록은 유지합니다.','remove-confirm',id);case 'remove-confirm':if(!V(id))return;try{if(!V(id).sample)await fileOp('readwrite',o=>o.delete(id));state.vault=state.vault.filter(d=>d.id!==id);for(const p of policies)if(!S(p).applied)S(p).checked=S(p).checked.filter(d=>d!==id);closeModal();notify('서류를 삭제했어요.')}catch{notify('삭제하지 못했어요.');return}break;case 'apply':if(!s.applied&&stage(p)<2)return;return confirmAction(s.applied?'신청 완료 표시 취소':'신청 완료 표시',s.applied?'완료 표시를 취소할까요?':'실제 기관에서 신청을 마쳤다는 가정으로 완료 표시를 할까요? 실제 신청은 전송되지 않아요.','apply-confirm');case 'apply-confirm':if(!s.applied&&stage(p)<2)return;s.applied=!s.applied;closeModal();notify(s.applied?'신청 완료로 표시했어요.':'완료 표시를 취소했어요.');break;case 'calendar-toggle':state.calendar=state.calendar.includes(id)?state.calendar.filter(x=>x!==id):[...state.calendar,id];notify(state.calendar.includes(id)?'마감일을 추가했어요.':'마감일을 제거했어요.');break;case 'ics':return exportICS([id]);case 'ics-all':return exportICS(state.calendar);case 'prev-month':month=new Date(month.getFullYear(),month.getMonth()-1,1);return render();case 'next-month':month=new Date(month.getFullYear(),month.getMonth()+1,1);return render();case 'tab':tab=id;return render();case 'filter':filter=id;return render();case 'new-post':return postForm();case 'delete-post':return confirmAction('게시글 삭제','내 시연 게시글을 삭제할까요?','delete-confirm',id);case 'delete-confirm':state.posts=state.posts.filter(x=>x.id!==id||!x.mine);closeModal();break;case 'close':return closeModal();default:return}store();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-action]');if(!b||b.disabled)return;if(b.dataset.nav)go(b.dataset.nav);else action(b.dataset.action,b.dataset.id||'').catch(()=>notify('처리하지 못했어요. 다시 시도해 주세요.'))});
document.addEventListener('change',e=>{if(view==='detail'&&e.target.matches('[data-criterion]')){const s=S(P(pid));if(!s.applied){s.criteria[+e.target.dataset.criterion]=e.target.checked;store();render()}}});document.addEventListener('input',e=>{if(e.target.id==='search'&&!e.isComposing){query=e.target.value;render();const input=$('search');input.focus();try{input.setSelectionRange(query.length,query.length)}catch{}}});
document.addEventListener('compositionend',e=>{if(e.target.id==='search'){query=e.target.value;render();$('search').focus()}});
document.addEventListener('submit',async e=>{const f=e.target;if(!['uploadform','postform'].includes(f.id))return;e.preventDefault();const data=new FormData(f),err=$('error'),submit=f.querySelector('[type=submit]');if(f.id==='uploadform'){const id=data.get('doc'),file=data.get('file');if(!docs[id]||!file?.size||file.size>10485760||!['application/pdf','image/png','image/jpeg','image/webp'].includes(file.type)){err.textContent='10MB 이하의 PDF 또는 PNG, JPEG, WEBP 파일을 선택하세요.';return}if(V(id)&&!window.confirm('같은 종류의 서류를 교체할까요?'))return;submit.disabled=true;try{await fileOp('readwrite',o=>o.put({blob:file,name:file.name},id));state.vault=state.vault.filter(d=>d.id!==id).concat({id,sample:false,filename:file.name,review:String(data.get('review')||'')});if(view==='detail'){const p=P(pid),s=S(p);if(p.docs.includes(id)&&!s.applied&&!s.checked.includes(id))s.checked.push(id)}store();closeModal();render();notify('시연용 서류를 저장했어요.')}catch{err.textContent='이 브라우저에서는 파일 저장을 사용할 수 없어요.';submit.disabled=false}}else{const title=String(data.get('title')).trim(),body=String(data.get('body')).trim(),policy=String(data.get('policy'));if(!title||!body||!P(policy)){err.textContent='제목과 내용을 입력하세요.';return}state.posts.unshift({id:'p'+Date.now(),name:'시연 사용자 (예시)',policy,title,body,mine:true});filter=policy;store();closeModal();render();notify('시연용 글을 등록했어요.')}});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(!$('modal').classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const all=[...$('dialog').querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea')];if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}});$('brand').innerHTML=brand;render();
</script></body></html>
